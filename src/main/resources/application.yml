server:
  port: 40203

spring:
  application:
    name: parse-short-video
  profiles:
    active: local
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML
  threads:
    virtual:
      enabled: true

# 日志配置
logging:
  level:
    com.ideaflow.parseshortvideo: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
